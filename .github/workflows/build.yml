name: Build Windows Executable (Fast)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build directory package
      shell: pwsh
      run: |
        # 目录打包，启动极快
        pyinstaller --windowed --icon=app_icon.ico --add-data "splash.png;." --add-data "app_icon.ico;." main.py
        # 压缩输出目录
        Compress-Archive -Path dist\main\* -DestinationPath dist\auto_report.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: auto_report_package
        path: dist/auto_report.zip

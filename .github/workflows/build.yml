name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 openpyxl Pillow

    - name: Build executable
      shell: pwsh
      run: |
        # 显式添加 PyQt5 等依赖的隐藏导入，防止遗漏
        pyinstaller --onefile --windowed --icon=app_icon.ico --add-data "splash.png;." --hidden-import PyQt5 --hidden-import openpyxl --hidden-import PIL main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: auto_report_exe
        path: dist/main.exe